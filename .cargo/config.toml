# ts-rs writes the TypeScript bindings wherever these point. Setting them here rather than
# on the command line means a bare `cargo test export_bindings` updates the frontend's types
# instead of dropping a stray `bindings/` directory in the repo root.
[env]
TS_RS_EXPORT_DIR = { value = "frontend/src/lib/api/types", relative = true }
TS_RS_LARGE_INT = "number"
