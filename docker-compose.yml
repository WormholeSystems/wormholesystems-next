services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector
      POSTGRES_DB: vector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
