name: Release wsctl

# Cut a release by pushing a tag:  git tag wsctl-v0.1.0 && git push --tags
# install.sh pulls the matching binary from the release this produces.
on:
  push:
    tags: ["wsctl-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than cross-compiling: nothing here needs a cross
          # toolchain, and a binary built on the platform it runs on is one less thing
          # to be wrong about.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build
        run: cargo build --release -p wsctl

      - name: Name it after its target
        run: |
          mv target/release/wsctl "wsctl-${{ matrix.target }}"
          ./wsctl-${{ matrix.target }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: wsctl-${{ matrix.target }}
          path: wsctl-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          gh release create "$TAG" dist/wsctl-* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes
