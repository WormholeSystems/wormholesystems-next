name: CI

# Three jobs, three questions:
#   rust      does the backend build, lint and pass its tests against a real Postgres
#   frontend  does the frontend type-check and pass its unit tests
#   offline   can the release image compile without a database
#
# The end-to-end suite is not here: it needs the whole stack plus a seeded universe, which
# means downloading and loading the SDE. Run it locally with `npm run test:e2e`.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    # The format job's fix-up commits are already covered by the run that produced them.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
          POSTGRES_DB: vector
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `#[sqlx::test]` makes a fresh database per test from this connection and applies the
      # migrations itself. The tests seed the handful of systems they need, so no SDE.
      DATABASE_URL: postgres://vector:vector@localhost:5432/vector

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npx vitest run

  offline:
    name: builds without a database
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}

    # `.sqlx` is what lets the release image compile without a database: the Dockerfile
    # builds with SQLX_OFFLINE=true. Nothing local notices when it falls behind, because dev
    # builds and tests talk to a real Postgres, so it rots quietly and the next deploy finds
    # out. It had drifted by 200 queries before this job existed.
    #
    # This compiles the way the image does rather than running `sqlx prepare --check`: sqlx
    # infers nullability from Postgres's query plan, so an empty CI database and a populated
    # developer one disagree about columns the planner cannot prove non-null, and the check
    # fails on a cache that is perfectly good.
    env:
      SQLX_OFFLINE: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compile against the query cache
        run: |
          if ! cargo check --all-targets --locked; then
            echo "::error::.sqlx is out of date, so the production image cannot build."
            echo "Regenerate it against a migrated, seeded database and commit the result:"
            echo "  cargo sqlx prepare -- --all-targets"
            exit 1
          fi
