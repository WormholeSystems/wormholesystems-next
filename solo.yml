name: vector
icon: null
processes:
  # Long-running dev services — start with the stack.
  Postgres:
    command: docker compose up db
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  ESI stub:
    command: node e2e/esi-stub.mjs
    working_dir: frontend
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  API:
    command: cargo run
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed:
      - src/**/*.rs
      - Cargo.toml
    env:
      ESI_BASE_URL: http://127.0.0.1:3999
  Frontend:
    command: npm run dev
    working_dir: frontend
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}

  # One-shot dev tasks — trigger manually from the process list.
  Format:
    command: cargo fmt --all
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Lint (Clippy):
    command: cargo clippy --all-targets
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Test:
    command: cargo test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Check:
    command: cargo check --all-targets
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  E2E:
    command: npm run test:e2e
    working_dir: frontend
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Export TS types:
    command: TS_RS_EXPORT_DIR=$PWD/frontend/src/lib/api/types TS_RS_LARGE_INT=number cargo test export_bindings
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Seed SDE:
    command: cargo run -- seed
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
