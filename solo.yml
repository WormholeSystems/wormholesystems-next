name: vector
icon: null
processes:
  # Long-running dev services — start with the stack.
  Postgres:
    command: docker compose up db
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}
  Leptos Watch:
    command: cargo leptos watch
    working_dir: null
    auto_start: true
    auto_restart: true
    restart_when_changed: []
    env: {}

  # One-shot dev tasks — trigger manually from the process list.
  Format:
    command: cargo fmt --all
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Lint (Clippy):
    command: cargo clippy --all-targets
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Test:
    command: cargo test
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Check:
    command: cargo check --all-targets
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
  Seed SDE:
    command: cargo run -- seed
    working_dir: null
    auto_start: false
    auto_restart: false
    restart_when_changed: []
    env: {}
